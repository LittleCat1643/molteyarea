<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>motley.io</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap">

    <link rel="stylesheet" href="styles/common.css">
    <link rel="stylesheet" href="styles/keyframes.css">
    <link rel="stylesheet" href="styles/home.css">
    <link rel="stylesheet" href="styles/matchmaking.css">
</head>
<body>
    <div class="wrapper">
        <div class="scenes">
            <div class="home">
                <div class="header">
                    <div class="rank">
                        <div class="bar">
                            <div class="progress"></div>
                        </div>
                    </div>
                    <div class="logo">
                        <img src="images/logo.png">
                    </div>
                </div>
                <div class="layout">
                    <div class="nickname">
                        <input type="text" placeholder="Ваш никнейм..." value="Игрок">
                    </div>
                    <div class="lobby">
                        <div class="play">
                            <button><b>Играть</b></button>
                        </div>
                        <div class="other">
                            <div class="skins">
                                <button><b>Скины</b></button>
                            </div>
                            <div class="records">
                                <button><b>Рекорды</b></button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="footer">
                    <div class="faq">
                        <button>
                            <img src="images/faq.png">
                        </button>
                    </div>
                    <div class="settings">
                        <button>
                            <img src="images/settings.png">
                        </button>
                    </div>
                </div>
            </div>
            <div class="matchmaking">
                <div class="header">
                    <h2>Подбор противников...</h2>
                </div>
                <div class="layout">
                    <div class="count">
                        <h3><span>0</span> из 10</h3>
                    </div>
                    <div class="members"></div>
                </div>
                <div class="footer">
                    <div class="exit">
                        <button><b>Выйти</b></button>
                    </div>
                </div>
            </div>
            <div class="game"></div>
        </div>
    </div>

    <script src="scripts/player.js"></script>
    <script src="scripts/scenes.js"></script>
    <script src="scripts/home.js"></script>
    <script src="scripts/matchmaking.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
