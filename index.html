<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

    <title>motley.io</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Iosevka+Charon+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="wrapper">
        <div class="scenes">
            <div class="menu">
                <div class="ui">
                    <div class="logo">
                        <img src="images/logo.png">
                    </div>
                    <div class="lobby">
                        <div class="nickname">
                            <input type="text" autocomplete="off" placeholder="Ваш никнейм..." value="Игрок">
                        </div>
                        <div class="buttons">
                            <div class="first">
                                <div class="skins">
                                    <button><img src="images/skins.png"> Скины</button>
                                </div>
                                <div class="play">
                                    <button><img src="images/play.png"> Играть</button>
                                </div>
                            </div>
                            <div class="second">
                                <div class="records">
                                    <button><img src="images/records.png"> Рекорды</button>
                                </div>
                                <div class="other">
                                    <div class="info">
                                        <button><img src="images/info.png"></button>
                                    </div>
                                    <div class="settings">
                                        <button><img src="images/settings.png"></button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
