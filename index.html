<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Motley Area</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="overlay">
        <div class="message">Пожалуйста, поверните устройство в альбомную ориентацию</div>
    </div>
    <div class="container">
        <div class="header">
            <div class="top">
                <div class="left">
                    <div class="leaderboard">
                        <div class="title">
                            <span>Лидеры</span>
                        </div>
                        <div class="content"></div>
                    </div>
                </div>
                <div class="center">
                    <div class="kills">
                        <span><i class="fi fi-rr-skull"></i> <b>0</b></span>
                    </div>
                    <div class="flags">
                        <span><i class="fi fi-rr-flag-alt"></i> <b>1</b></span>
                    </div>
                    <div class="square">
                        <span><i class="fi fi-rr-vector"></i> <b>9</b></span>
                    </div>
                </div>
                <div class="right">
                    <div class="map"></div>
                </div>
            </div>
            <div class="center">
                <div class="left"></div>
                <div class="right">
                    <div class="zoom">
                        <div class="more">
                            <button><i class="fi fi-sr-plus"></i></button>
                        </div>
                        <div class="less">
                            <button><i class="fi fi-sr-minus"></i></button>
                        </div>
                        <div class="full">
                            <button><i class="fi fi-sr-expand"></i></button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="bottom">
                <div class="left">
                    <div class="joystick">
                        <div class="handlers">
                            <div class="top"></div>
                            <div class="right"></div>
                            <div class="bottom"></div>
                            <div class="left"></div>
                        </div>
                        <div class="button">
                            <button><i class="fi fi-rr-arrows"></i></button>
                        </div>
                    </div>
                </div>
                <div class="right">
                    <div class="attack">
                        <div class="button">
                            <button><i class="fi fi-rr-location-crosshairs"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="layout">
            <div class="game">
                <div class="field"></div>
            </div>
        </div>
        <div class="footer"></div>
    </div>
    <script src="scripts/main.js"></script>
</body>
</html>
