<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Motley Area</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="top">
                <div class="left"></div>
                <div class="center"></div>
                <div class="right"></div>
            </div>
            <div class="center">
                <div class="left"></div>
                <div class="right"></div>
            </div>
            <div class="bottom">
                <div class="left">
                    <div class="joystick">
                        <div class="top">
                            <div class="button">
                                <button><i class="fi fi-sr-arrow-up"></i></button>
                            </div>
                        </div>
                        <div class="center">
                            <div class="button">
                                <button><i class="fi fi-sr-arrow-left"></i></button>
                            </div>
                            <div class="button">
                                <button><i class="fi fi-sr-location-crosshairs"></i></button>
                            </div>
                            <div class="button">
                                <button><i class="fi fi-sr-arrow-right"></i></button>
                            </div>
                        </div>
                        <div class="bottom">
                            <div class="button">
                                <button><i class="fi fi-sr-arrow-down"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="center"></div>
                <div class="right"></div>
            </div>
        </div>
        <div class="layout">
            <div class="game">
                <div class="field"></div>
            </div>
        </div>
        <div class="footer"></div>
    </div>
    <script src="scripts/main.js"></script>
</body>
</html>
